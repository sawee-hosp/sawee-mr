<!DOCTYPE html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบยา รพ.สวี · Pharmacy Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ff;--ink:#0d1b33;--muted:#63758f;--line:#e6eefb;--glass:rgba(255,255,255,.75);
--g-head:linear-gradient(96deg,#2f6bff,#7b46ff 40%,#00c2b2 78%,#2ee6b0);
--g-btn:linear-gradient(120deg,#2f6bff,#7b46ff 55%,#00c2b2);
--g-mint:linear-gradient(135deg,#7af0c8,#4fc3ff);--g-lilac:linear-gradient(135deg,#a78bfa,#60a5fa);
--g-peach:linear-gradient(135deg,#ffb37a,#ff7ab8);--g-sun:linear-gradient(135deg,#ffd76e,#ff9d5c);
--g-rose:linear-gradient(135deg,#ff4d6d,#ff8a5b);
--sh-s:0 6px 18px -10px rgba(24,54,120,.35);--sh-l:0 26px 64px -30px rgba(24,54,120,.5);--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);
min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:.1px;line-height:1.65}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(95px);opacity:.45;z-index:-1}
body::before{width:640px;height:640px;background:var(--g-mint);top:-240px;left:-180px;animation:fl 20s ease-in-out infinite}
body::after{width:580px;height:580px;background:var(--g-peach);bottom:-240px;right:-160px;animation:fl 26s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translate(50px,-36px) scale(1.1)}}
h1,h2,h3,.grad{font-family:'Anuphan',sans-serif;font-weight:700;line-height:1.35;background:var(--g-head);
-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% auto;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:220% center}}
h1{font-size:clamp(27px,4vw,42px);letter-spacing:-.6px}h2{font-size:clamp(19px,2.5vw,26px)}h3{font-size:17px}
.sub{color:var(--muted);font-size:14.5px;font-weight:300}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(165%);border:1px solid rgba(255,255,255,.86);
box-shadow:var(--sh-l);border-radius:var(--r)}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:11px 20px;
background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex:none}
.brand .logo{width:42px;height:42px;border-radius:14px;background:var(--g-btn);display:grid;place-items:center;
color:#fff;font-size:20px;box-shadow:var(--sh-s)}
.brand b{font-family:'Anuphan';font-size:16.5px;background:var(--g-head);-webkit-background-clip:text;
background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:10.5px;font-weight:300;letter-spacing:.5px}
.nav-links{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{position:relative;white-space:nowrap;color:var(--muted);font-size:14px;font-weight:500;
padding:9px 14px;border-radius:12px;transition:.22s;cursor:pointer}
.nav-links a:hover{background:#eef4ff;color:#2f6bff}
.nav-links a.active{background:var(--g-btn);color:#fff;box-shadow:var(--sh-s)}
.nav-links a .dot{position:absolute;top:2px;right:3px;min-width:17px;height:17px;padding:0 4px;
background:var(--g-rose);color:#fff;font-size:10px;border-radius:9px;display:grid;place-items:center;font-weight:600}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:14px;
color:#fff;background:var(--g-btn);background-size:180% auto;box-shadow:var(--sh-s);transition:.25s;
display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{background-position:right center;transform:translateY(-2px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:#fff;color:#2f6bff;border:1.5px solid #dbe7ff;box-shadow:none}
.btn.ghost:hover{border-color:#2f6bff;background:#f5f9ff}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn.danger{background:var(--g-rose)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);
border-radius:13px;font-family:inherit;font-size:14.5px;background:#fff;transition:.2s;color:var(--ink)}
.field textarea{min-height:150px;resize:vertical;line-height:1.7}
.field :focus{outline:0;border-color:#7b9dff;box-shadow:0 0 0 4px rgba(47,107,255,.12)}
.wrap{max-width:1260px;margin:0 auto;padding:28px 20px 80px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.grid{display:grid;gap:17px;grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.card{position:relative;padding:21px;border-radius:var(--r);background:#fff;border:1px solid var(--line);
cursor:pointer;overflow:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1.4),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh-l);border-color:#cfe0ff}
.card .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;
margin-bottom:13px;box-shadow:var(--sh-s)}
.card h4{font-family:'Anuphan';font-size:16.5px;font-weight:600;margin-bottom:4px}
.card p{font-size:12.8px;color:var(--muted);font-weight:300;line-height:1.6}
.badge{position:absolute;top:15px;right:15px;background:var(--g-rose);color:#fff;font-size:10.5px;
font-weight:600;padding:3px 9px;border-radius:20px}
.badge.new{background:var(--g-mint);animation:bl 2.2s ease-in-out infinite}
@keyframes bl{50%{opacity:.55}}
.row-item{display:flex;gap:15px;padding:16px;border-radius:18px;background:#fff;border:1px solid var(--line);
cursor:pointer;transition:.25s;margin-bottom:11px;align-items:center}
.row-item:hover{border-color:#cfe0ff;box-shadow:var(--sh-s);transform:translateX(3px)}
.row-item .pic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px;flex:none}
.row-item h4{font-family:'Anuphan';font-size:15.5px;font-weight:600;margin-bottom:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 10px;border-radius:20px;color:#fff;margin-right:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{padding:7px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13px;
cursor:pointer;transition:.2s;font-family:inherit;color:var(--muted)}
.chip:hover{border-color:#7b9dff}
.chip.on{background:var(--g-btn);color:#fff;border-color:transparent;box-shadow:var(--sh-s)}
.doc{font-size:15.5px;line-height:1.95;color:#22334f}
.doc h1,.doc h2,.doc h3{margin:22px 0 10px}.doc p{margin-bottom:13px}
.doc ul,.doc ol{margin:0 0 15px 24px}.doc li{margin-bottom:6px}
.doc strong{font-weight:600;color:#0d1b33}.doc a{color:#2f6bff}
.doc blockquote{border-left:4px solid #2f6bff;background:#f4f8ff;padding:12px 18px;border-radius:0 12px 12px 0;margin-bottom:14px}
.doc code{background:#eef4ff;padding:2px 7px;border-radius:6px;font-size:13.5px}
.doc hr{border:0;height:1px;background:var(--line);margin:20px 0}
.bell{position:relative;width:43px;height:43px;border-radius:14px;border:1.5px solid var(--line);background:#fff;
cursor:pointer;font-size:18px;display:grid;place-items:center;transition:.2s;flex:none}
.bell:hover{border-color:#7b9dff}
.bell b{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;font-size:10.5px;background:var(--g-rose);
color:#fff;border-radius:10px;display:grid;place-items:center;border:2px solid #fff}
.panel{position:absolute;right:0;top:54px;width:min(390px,92vw);max-height:74vh;overflow:auto;padding:9px;display:none;z-index:60}
.panel.open{display:block;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}}
.noti{display:flex;gap:11px;padding:12px;border-radius:14px;transition:.2s;cursor:pointer}
.noti:hover{background:#f2f7ff}.noti.unread{background:linear-gradient(90deg,#eff6ff,#fff)}
.noti .bar{width:4px;border-radius:4px;background:var(--g-mint);flex:none}
.noti .bar.warn{background:var(--g-sun)}.noti .bar.crit{background:var(--g-rose)}
.noti h5{font-family:'Anuphan';font-size:14px;font-weight:600}
.noti p{font-size:12.3px;color:var(--muted);font-weight:300}
.noti time{font-size:10.5px;color:#9aa9c0}
table{width:100%;border-collapse:collapse;font-size:13.8px}
th,td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:'Anuphan';font-weight:600;color:var(--muted);font-size:12.3px}
.modal{display:none;position:fixed;inset:0;z-index:99;background:rgba(11,25,52,.5);backdrop-filter:blur(7px);padding:22px}
.modal.open{display:block;animation:pop .2s ease}
.err{color:#e11d48;font-size:13px;margin-bottom:10px;display:none;background:#fff1f4;padding:10px 13px;border-radius:11px}
.hide{display:none!important}
.spin{width:34px;height:34px;border:3px solid #dce7ff;border-top-color:#2f6bff;border-radius:50%;
animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){.nav{padding:10px 13px}.brand small{display:none}.uinfo{display:none}}
</style></head><body>

<div id="vLogin" class="center">
  <div class="glass" style="width:min(430px,100%);padding:38px 32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:66px;height:66px;margin:0 auto 14px;border-radius:22px;background:var(--g-btn);
        display:grid;place-items:center;font-size:31px;box-shadow:var(--sh-l)">💊</div>
      <h1>ระบบยา รพ.สวี</h1><p class="sub">Swi Hospital · Pharmacy Digital Platform</p>
    </div>
    <div id="errLogin" class="err"></div>
    <form id="fLogin">
      <div class="field"><label>ชื่อผู้ใช้</label>
        <input name="username" autocomplete="username" required placeholder="เช่น pharm01"></div>
      <div class="field"><label>รหัสผ่าน</label>
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn" style="width:100%;justify-content:center">เข้าสู่ระบบ</button>
    </form>
    <p class="sub" style="text-align:center;margin-top:18px;font-size:11.5px">
      🔒 เข้าครั้งแรกให้ตั้งรหัสผ่านเอง · ยังไม่มีชื่อในระบบ ติดต่อผู้ดูแล</p>
  </div>
</div>

<div id="vSetup" class="center hide">
  <div class="glass" style="width:min(430px,100%);padding:38px 32px">
    <h2 style="margin-bottom:5px">ตั้งรหัสผ่านครั้งแรก</h2>
    <p class="sub" id="setupWho" style="margin-bottom:18px"></p>
    <div id="errSetup" class="err"></div>
    <form id="fSetup">
      <div class="field"><label>รหัสผ่านใหม่</label><input name="password" type="password" required></div>
      <div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input name="confirm" type="password" required></div>
      <button class="btn" style="width:100%;justify-content:center">บันทึกและเข้าใช้งาน</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:11.5px;color:#e11d48">
      ⚠️ ห้ามใช้รหัสเดียวกับ HOSxP หรือ Gmail — ระบบนี้เป็นรหัสแยกต่างหาก</p>
    <p style="text-align:center;margin-top:8px"><a class="sub" onclick="go('Login')" style="cursor:pointer">← กลับ</a></p>
  </div>
</div>

<div id="vApp" class="hide">
<nav class="nav">
  <div class="brand" onclick="page('home')"><div class="logo">💊</div>
    <div><b>ระบบยา รพ.สวี</b><small>PHARMACY PLATFORM</small></div></div>
  <div class="nav-links" id="navLinks"></div>
  <div style="position:relative">
    <button class="bell" id="bellBtn">🔔<b id="bellCount" class="hide">0</b></button>
    <div class="glass panel" id="notiPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 9px">
        <h3>การแจ้งเตือน</h3><button class="btn ghost sm" id="readAll">อ่านทั้งหมด</button></div>
      <div id="notiList"></div></div>
  </div>
  <div id="userBox" style="display:flex;align-items:center;gap:9px"></div>
</nav>
<div class="wrap" id="page"></div>
</div>

<div id="modal" class="modal"><div class="glass"
  style="height:100%;display:flex;flex-direction:column;overflow:hidden;max-width:1000px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;
    border-bottom:1px solid var(--line)"><h2 id="mTitle">—</h2>
    <button class="btn ghost sm" onclick="closeModal()">ปิด ✕</button></div>
  <div id="mBody" style="flex:1;overflow:auto"></div>
</div></div>

<script>
/* ═════════ ตั้งค่า ═════════ */
const API = 'https://script.google.com/macros/s/AKfycbzd7AyDe-ChL4K-RZBGiffX06pxZsqwFHlOl18H0Er95K2ytveOtVoqGLeSiYLhSpz5yw/exec';

/* ═════════ ตัวช่วย ═════════ */
let TOKEN = localStorage.getItem('swi_tk') || '';
let ME=null, APPS=[], POSTS=[], DOCS=[], NOTIS=[], PAGE='home', FP='ทั้งหมด', FD='ทั้งหมด', TAB='apps';
const $  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action, data){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action:action, token:TOKEN}, data||{}))});
  const j = await r.json();
  if(j.error === 'auth'){ logout(); throw new Error('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
  if(j.error) throw new Error(j.error);
  return j.data;
}
async function sha(user, pw){
  const b = new TextEncoder().encode('swi|'+String(user).trim().toLowerCase()+'|'+pw);
  const h = await crypto.subtle.digest('SHA-256', b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
const go = v => ['Login','Setup','App'].forEach(x => $('v'+x).classList.toggle('hide', x!==v));
const showErr = (el,m) => { const e=$(el); e.textContent='⚠️ '+m; e.style.display='block'; };
function logout(){ localStorage.removeItem('swi_tk'); TOKEN=''; ME=null; go('Login'); }
const ago = t => { const m=(Date.now()-new Date(t))/6e4; return m<1?'เมื่อสักครู่':
  m<60?Math.floor(m)+' นาทีที่แล้ว': m<1440?Math.floor(m/60)+' ชม.ที่แล้ว': Math.floor(m/1440)+' วันที่แล้ว'; };
const thDate = t => t ? new Date(t).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}) : '';
const uniq = (arr,k) => arr.map(x=>x[k]).filter((v,i,a)=>v&&a.indexOf(v)===i);

/* ═════════ Login ═════════ */
$('fLogin').onsubmit = async e => {
  e.preventDefault(); $('errLogin').style.display='none';
  const b = e.target.querySelector('button'); b.disabled=true; b.textContent='กำลังตรวจสอบ…';
  try{
    const f = Object.fromEntries(new FormData(e.target));
    const r = await call('login', {username:f.username, password: await sha(f.username, f.password)});
    if(r.needSetup){ $('fSetup').dataset.u = r.username;
      $('setupWho').textContent = r.fullname + ' · ' + r.username;
      $('errSetup').style.display='none'; go('Setup'); }
    else start(r);
  }catch(ex){ showErr('errLogin', ex.message); }
  b.disabled=false; b.textContent='เข้าสู่ระบบ';
};
/* รหัสผ่านอิสระ — ไม่บังคับความยาว/รูปแบบ ครั้งแรกตั้งอย่างไรก็ได้ */
$('fSetup').onsubmit = async e => {
  e.preventDefault(); $('errSetup').style.display='none';
  const f = Object.fromEntries(new FormData(e.target)), un = e.target.dataset.u;
  if(!f.password) return showErr('errSetup','กรุณากรอกรหัสผ่าน');
  if(f.password !== f.confirm) return showErr('errSetup','รหัสผ่านทั้งสองช่องไม่ตรงกัน');
  const b = e.target.querySelector('button'); b.disabled=true; b.textContent='กำลังบันทึก…';
  try{ start(await call('setPassword', {username:un, password: await sha(un, f.password)})); }
  catch(ex){ showErr('errSetup', ex.message); }
  b.disabled=false; b.textContent='บันทึกและเข้าใช้งาน';
};
function start(r){ TOKEN=r.token; localStorage.setItem('swi_tk',TOKEN); ME=r.me;
  go('App'); boot(); setInterval(refresh, 45000); }

/* ═════════ Boot (กัน undefined ทุกจุด) ═════════ */
async function boot(){
  $('page').innerHTML = '<div class="spin"></div>';
  const d = await call('boot');
  ME    = d.me    || ME;
  APPS  = d.apps  || [];
  POSTS = d.posts || [];
  DOCS  = d.docs  || [];
  NOTIS = d.notis || [];
  renderUser(); renderNav(); renderNoti(); page(PAGE);
}
async function refresh(){
  try{
    const d = await call('boot');
    APPS  = d.apps  || [];
    POSTS = d.posts || [];
    DOCS  = d.docs  || [];
    NOTIS = d.notis || [];
    renderNav(); renderNoti();
    if(['home','board','docs'].indexOf(PAGE) > -1) page(PAGE);
  }catch(e){}
}
function renderUser(){
  $('userBox').innerHTML =
   '<div class="uinfo" style="text-align:right;line-height:1.25">' +
   '<div style="font-size:13px;font-weight:600">'+esc(ME.fullname)+'</div>' +
   '<div style="font-size:10.5px;color:var(--muted)">'+esc(ME.position||'')+' · '+esc(ME.role)+'</div></div>' +
   (ME.role==='admin' ? '<button class="btn ghost sm" onclick="page(\'admin\')">⚙️</button>' : '') +
   '<button class="btn ghost sm" onclick="logout()">ออก</button>';
}
function renderNav(){
  const newP = (POSTS||[]).filter(p=>p.isNew).length;
  const newD = (DOCS ||[]).filter(d=>d.isNew).length;
  const items = [{k:'home',t:'🏠 หน้าหลัก'},{k:'board',t:'📢 ประกาศ',n:newP},{k:'docs',t:'📁 เอกสาร & ฟอร์ม',n:newD}]
    .concat((APPS||[]).slice(0,5).map(a=>({k:'app:'+a.id, t:(a.icon||'▪️')+' '+a.name, n:a.unread})));
  $('navLinks').innerHTML = items.map(i =>
    '<a class="'+(PAGE===i.k?'active':'')+'" onclick="page(\''+i.k+'\')">'+esc(i.t)+
    (i.n ? '<span class="dot">'+i.n+'</span>' : '')+'</a>').join('');
}

/* ═════════ Router ═════════ */
function page(k){ PAGE=k; renderNav(); scrollTo({top:0,behavior:'smooth'});
  if(k==='home') return pHome();
  if(k==='board') return pBoard();
  if(k==='docs') return pDocs();
  if(k==='admin') return pAdmin();
  if(k.indexOf('app:')===0) return openApp(k.slice(4));
}
const PAL = ['var(--g-mint)','var(--g-lilac)','var(--g-peach)','var(--g-btn)','var(--g-sun)'];
const PIC = {'ประกาศ':'📢','แนวปฏิบัติ':'📋','SOP':'📘','เตือนภัย':'⚠️','ข่าวสาร':'📰'};
const PBG = {'ประกาศ':'var(--g-lilac)','แนวปฏิบัติ':'var(--g-mint)','SOP':'var(--g-btn)',
             'เตือนภัย':'var(--g-rose)','ข่าวสาร':'var(--g-sun)'};
const DBG = {'ฟอร์ม':'var(--g-btn)','คู่มือ':'var(--g-lilac)','SOP':'var(--g-mint)',
             'แบบบันทึก':'var(--g-sun)','ลิงก์ระบบ':'var(--g-peach)'};

/* ── หน้าหลัก ── */
function pHome(){
  const gs = {}; (APPS||[]).forEach(a => (gs[a.group] = gs[a.group]||[]).push(a));
  const fresh = (POSTS||[]).filter(p=>p.isNew||p.pin).slice(0,3);

function md(t){ return esc(t)
  .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
  .replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^---$/gm,'<hr>')
  .replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>')
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>'); }

    (p.ack_required ? '<div style="margin-top:26px;padding-top:20px;border-top:1px solid var(--line)">' +
      (p.acked ? '<p class="sub">✅ ท่านรับทราบเอกสารฉบับนี้แล้ว</p>'
               : '<button class="btn" onclick="doAck(\''+p.id+'\')">✓ รับทราบและถือปฏิบัติ</button>') + '</div>' : '') +

function renderNoti(){
  const un = (NOTIS||[]).filter(n=>!n.read).length;
  $('bellCount').classList.toggle('hide', !un);
  $('bellCount').textContent = un>99 ? '99+' : un;
  $('notiList').innerHTML = (NOTIS||[]).length ? NOTIS.map(n =>
    '<div class="noti '+(n.read?'':'unread')+'" onclick="hitNoti(\''+n.id+'\',\''+n.app_id+'\')">' +
    '<div class="bar '+esc(n.level)+'"></div><div style="flex:1">' +
    '<h5>'+esc(n.title)+'</h5><p>'+esc(n.message)+'</p>' +
    '<time>'+esc(n.app_name)+' · '+ago(n.at)+'</time></div></div>').join('')
    : '<p class="sub" style="padding:30px;text-align:center">ไม่มีการแจ้งเตือน 🎉</p>';
}
async function hitNoti(id, app){
  await call('markRead',{id:id}); (NOTIS||[]).filter(n=>n.id===id).forEach(n=>n.read=true); renderNoti();
  $('notiPanel').classList.remove('open');
  if(app==='board') page('board'); else if(app==='docs') page('docs');
  else if((APPS||[]).some(a=>a.id===app)) page('app:'+app);
}
$('bellBtn').onclick = () => $('notiPanel').classList.toggle('open');
$('readAll').onclick = async e => { e.stopPropagation(); await call('markRead',{all:true});
  (NOTIS||[]).forEach(n=>n.read=true); renderNoti(); await refresh(); };
document.addEventListener('click', e => { if(!e.target.closest('#bellBtn,#notiPanel'))
  $('notiPanel').classList.remove('open'); });

const rmDoc = async id => { if(!confirm('ลบรายการนี้?')) return;
  await call('deleteDoc',{id:id}); await refresh(); pAdmin(); };

async function admUsers(){
  const U = await call('listUsers');
  $('adm').innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:8px">' +
    '<h2>ผู้ใช้งาน ('+U.length+')</h2><button class="btn sm" onclick="edUser()">＋ เพิ่มผู้ใช้</button></div>' +
    '<p class="sub" style="margin-bottom:14px">เพิ่มชื่อไว้ก่อน → ผู้ใช้เข้าเว็บครั้งแรกแล้วตั้งรหัสผ่านเอง ' +
    '(รหัสผ่านยาว/สั้น/รูปแบบใดก็ได้ตามใจผู้ใช้ ระบบเก็บเป็นค่าเข้ารหัส ผู้ดูแลดูรหัสจริงไม่ได้)</p>' +
    '<table><thead><tr><th>ชื่อ-สกุล</th><th>username</th><th>สิทธิ์</th><th>รหัสผ่าน</th><th>เข้าล่าสุด</th><th></th></tr></thead><tbody>' +
    U.map(u => '<tr><td><b>'+esc(u.fullname)+'</b><br><span class="sub" style="font-size:10.5px">'+esc(u.position||'')+'</span></td>' +
      '<td>'+esc(u.username)+'</td>' +
      '<td><select class="btn ghost sm" style="padding:5px" onchange="setRole(\''+esc(u.username)+'\',this.value)">' +
        ['staff','pharmacist','tech','admin'].map(r=>'<option '+(u.role===r?'selected':'')+'>'+r+'</option>').join('') + '</select></td>' +
      '<td>'+(u.hasPw?'🔒 ตั้งแล้ว':'⚠️ ยังไม่ตั้ง')+'</td>' +
      '<td class="sub" style="font-size:11.5px">'+(u.last_login?ago(u.last_login):'—')+'</td>' +
      '<td><button class="btn ghost sm" onclick="rstPw(\''+esc(u.username)+'\')">รีเซ็ตรหัส</button>' +
      '<button class="btn ghost sm" onclick="tglU(\''+esc(u.username)+'\','+u.active+')">'+(u.active?'ระงับ':'เปิด')+'</button></td></tr>').join('') +
    '</tbody></table>';
}
function edUser(){
  form('เพิ่มผู้ใช้ใหม่',[
    ['username','ชื่อผู้ใช้ (ห้ามซ้ำ)','text','','somchai'],
    ['fullname','ชื่อ-สกุล','text','','ภก.สมชาย ใจดี'],
    ['position','ตำแหน่ง','text','','เภสัชกรชำนาญการ'],
    ['role','สิทธิ์','select','staff','',[['staff','staff — เจ้าหน้าที่'],['pharmacist','pharmacist — เภสัชกร'],
      ['tech','tech — จพ.เภสัชกรรม'],['admin','admin — ผู้ดูแลระบบ']]]
  ], async v => { await call('saveUser',{user:v}); closeModal(); pAdmin();
    alert('เพิ่มแล้ว ✓ แจ้งผู้ใช้เข้าเว็บด้วย username นี้ แล้วตั้งรหัสผ่านเองได้เลย'); });
}
const setRole = async (u,r) => { await call('saveUser',{user:{username:u, role:r}}); };
const tglU = async (u,a) => { await call('saveUser',{user:{username:u, active:a?'FALSE':'TRUE'}}); admUsers(); };
const rstPw = async u => { if(!confirm('รีเซ็ตรหัสผ่านของ '+u+' ?\nผู้ใช้จะตั้งรหัสใหม่เองตอน login ครั้งถัดไป')) return;
  await call('resetPw',{username:u}); admUsers(); alert('รีเซ็ตแล้ว ✓'); };

/* ── ตัวสร้างฟอร์มกลาง ── */
function form(title, fields, onSave){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = '<div style="padding:26px 30px;max-width:680px;margin:0 auto">' +
    '<div id="errF" class="err"></div><form id="gf">' +
    fields.map(f => { const k=f[0],l=f[1],t=f[2],v=f[3],ph=f[4]||'',op=f[5];
      return '<div class="field"><label>'+l+'</label>' + (
        t==='textarea' ? '<textarea name="'+k+'" placeholder="'+ph+'">'+esc(v||'')+'</textarea>'
      : t==='select'   ? '<select name="'+k+'">'+op.map(o =>
          '<option value="'+o[0]+'" '+(String(v)===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>'
      : '<input name="'+k+'" type="'+t+'" value="'+esc(v==null?'':v)+'" placeholder="'+ph+'">') + '</div>'; }).join('') +
    '<button class="btn" style="width:100%;justify-content:center">💾 บันทึก</button></form></div>';
  $('gf').onsubmit = async e => {
    e.preventDefault();
    const b = e.target.querySelector('button'); b.disabled=true; b.textContent='กำลังบันทึก…';
    try{ await onSave(Object.fromEntries(new FormData(e.target))); }
    catch(ex){ showErr('errF', ex.message); }
    b.disabled=false; b.textContent='💾 บันทึก';
  };
  $('modal').classList.add('open');
}
const closeModal = () => $('modal').classList.remove('open');
$('modal').onclick = e => { if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown', e => e.key==='Escape' && closeModal());

if(TOKEN){ go('App'); boot().then(()=>setInterval(refresh,45000)).catch(logout); } else go('Login');
</script></body></html>
