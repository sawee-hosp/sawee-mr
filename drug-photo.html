
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="no-referrer">
<title>ถ่ายรูปยา · Sawee Rxfill</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📷</text></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  body{font-family:Sarabun,sans-serif;background:#f4f7fb;padding-bottom:40px}
  .res{cursor:pointer}.res:hover{background:#eef4ff}
  .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#e9eef5}
  .ph-card.primary{outline:3px solid #198754;border-radius:12px}
  #preview{max-height:320px;object-fit:contain;border-radius:10px;background:#000}
  .muted{color:#6c7a89;font-size:.85rem}
  .pill{display:inline-block;background:#e7eef8;border-radius:20px;padding:1px 10px;margin:2px;font-size:.8rem}
</style>
</head>
<body>
<nav class="navbar bg-white border-bottom sticky-top"><div class="container">
  <span class="navbar-brand fw-bold">📷 ถ่ายรูปยา</span>
  <span class="muted" id="who"></span>
</div></nav>

<div class="container py-3" style="max-width:820px">
  <!-- login -->
  <div id="vLogin" class="card shadow-sm mx-auto" style="max-width:380px"><div class="card-body">
    <h6 class="mb-3">เข้าสู่ระบบ (ผู้ดูแล)</h6>
    <input id="lu" class="form-control mb-2" placeholder="Username">
    <button class="btn btn-primary w-100" onclick="login()">เข้าสู่ระบบ</button>
  </div></div>

  <!-- search -->
  <div id="vMain" class="d-none">
    <input id="q" class="form-control form-control-lg mb-2" placeholder="ค้นหา: ชื่อยา / icode / invs code / TMTID">
    <div id="list" class="list-group mb-3"></div>

    <div id="drug" class="d-none">
      <div class="card mb-3"><div class="card-body">
        <div class="d-flex justify-content-between"><div>
          <h5 class="mb-0" id="dName"></h5>
          <div class="muted">icode HOSxP: <b id="dIcode"></b> · <span id="dUnit"></span></div></div>
          <button class="btn btn-sm btn-light" onclick="closeDrug()">✕</button></div>
        <div id="dLoc" class="mt-2 small"></div>
      </div></div>

      <div class="card mb-3"><div class="card-body">
        <h6>ถ่ายรูปใหม่</h6>
        <div class="row g-2">
          <div class="col-md-6"><label class="form-label small mb-0">รหัสคลัง (invs code)</label>
            <select id="fInvs" class="form-select"></select></div>
          <div class="col-md-6"><label class="form-label small mb-0">TMTID</label>
            <input id="fTmt" class="form-control" list="tmtList" placeholder="เลือก/พิมพ์ TMTID"><datalist id="tmtList"></datalist></div>
          <div class="col-md-8"><label class="form-label small mb-0">ยี่ห้อ / บริษัท</label><input id="fBrand" class="form-control"></div>
          <div class="col-md-4 d-flex align-items-end"><div class="form-check"><input type="checkbox" class="form-check-input" id="fPrimary"><label class="form-check-label" for="fPrimary">ตั้งเป็นรูปหลัก</label></div></div>
          <div class="col-12"><input type="file" id="fFile" accept="image/*" capture="environment" class="form-control"></div>
          <div class="col-12 text-center"><img id="preview" class="d-none w-100"></div>
          <div class="col-12"><button id="bUp" class="btn btn-success w-100" disabled onclick="upload()">อัปโหลดรูป</button></div>
        </div>
        <div class="muted mt-2">รูปเก็บในโฟลเดอร์ drugcode_Images · ระบบเก็บแค่ URL ในชีต DrugPhotos ผูกกับ icode + invs code + TMTID</div>
      </div></div>

      <h6>รูปที่มีอยู่ <span class="muted" id="pCount"></span></h6>
      <div class="row g-2" id="photos"></div>
    </div>
  </div>
</div>

<script>
  // ใช้ URL เดียวกับหน้าห้องยา (Code.gs admin)
  const API_URL = "https://script.google.com/macros/s/AKfycbwV8w7I53ilAwN6uSblnrrohfVeQSZd-Hm_O3jfyQRI4z3hDt_nTSxQCVgQ_BPPVsd9uQ/exec";
  let USER = null, CUR = null, t = null;
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function callApi(action, payload = {}) {
    const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) });
    return r.json();
  }
  async function login() {
    const u = $('lu').value.trim(); if (!u) return;
    const r = await callApi('adminLogin', u);
    if (!r.status) return Swal.fire('ไม่พบผู้ใช้', r.message || '', 'error');
    USER = r.user; try { localStorage.setItem('photo_user', JSON.stringify(USER)); } catch (e) {}
    start();
  }
  function start() {
    $('vLogin').classList.add('d-none'); $('vMain').classList.remove('d-none');
    $('who').textContent = USER.name;
    const ic = new URLSearchParams(location.search).get('icode'); if (ic) openDrug(ic);
  }
  $('q').oninput = () => { clearTimeout(t); t = setTimeout(search, 350); };
  async function search() {
    const kw = $('q').value.trim(); if (kw.length < 2) { $('list').innerHTML = ''; return; }
    $('list').innerHTML = '<div class="list-group-item muted">กำลังค้นหา…</div>';
    const r = await callApi('photoSearch', { kw });
    $('list').innerHTML = (r.data || []).map(d => `<div class="list-group-item res ${d.inactive ? 'text-muted' : ''}" onclick="openDrug('${esc(d.icode)}')">
      <div class="d-flex justify-content-between"><b>${esc(d.name)}</b><span class="badge ${d.photos ? 'text-bg-success' : 'text-bg-secondary'}">${d.photos} รูป</span></div>
      <div class="muted">${esc(d.icode)} · ${esc(d.strength || '')} ${esc(d.units || '')} ${d.invs.map(x => `<span class="pill">invs ${esc(x)}</span>`).join('')}</div></div>`).join('') || '<div class="list-group-item muted">ไม่พบในรายการยา HOSxP</div>';
  }
  async function openDrug(icode) {
    $('list').innerHTML = '';
    const r = await callApi('photoGetDrug', { icode });
    if (!r.status) return Swal.fire('ผิดพลาด', r.message, 'error');
    CUR = r.data;
    $('drug').classList.remove('d-none');
    $('dName').textContent = CUR.name || '(ไม่พบชื่อใน HOSxP)'; $('dIcode').textContent = CUR.icode;
    $('dUnit').textContent = [CUR.strength, CUR.units].filter(Boolean).join(' · ');
    $('dLoc').innerHTML = CUR.location ? `<pre class="mb-0 small">${esc(CUR.location.note_text)}</pre>` : '<span class="muted">ไม่มีเก็บสำรองในกล่อง</span>';
    $('fInvs').innerHTML = '<option value="">— ไม่ระบุ —</option>' + CUR.drugcode.map(d => `<option value="${esc(d.invs_code)}" data-tmt="${esc(d.new_tmtid || d.tmtid)}" data-brand="${esc(d.company)}">${esc(d.invs_code)} · ${esc(d.invs_name)} (${esc(d.company)})</option>`).join('');
    $('tmtList').innerHTML = CUR.drugcode.flatMap(d => [d.tmtid, d.new_tmtid]).filter(Boolean).map(x => `<option value="${esc(x)}">`).join('');
    if (CUR.drugcode.length === 1) { $('fInvs').selectedIndex = 1; $('fInvs').onchange(); }
    renderPhotos();
    window.scrollTo(0, 0);
  }
  $('fInvs').onchange = () => { const o = $('fInvs').selectedOptions[0]; if (o && o.value) { $('fTmt').value = o.dataset.tmt || ''; $('fBrand').value = o.dataset.brand || ''; } };
  function renderPhotos() {
    $('pCount').textContent = `(${CUR.photos.length})`;
    $('photos').innerHTML = CUR.photos.map(p => `<div class="col-6 col-md-4"><div class="card ph-card ${p.primary ? 'primary' : ''}">
      <a href="${esc(p.url)}" target="_blank"><img class="ph" src="${esc(p.url)}" referrerpolicy="no-referrer"></a>
      <div class="card-body p-2 small">${p.primary ? '<span class="badge text-bg-success">รูปหลัก</span> ' : ''}${p.invs_code ? 'invs ' + esc(p.invs_code) : ''} ${p.tmtid ? '· TMT ' + esc(p.tmtid) : ''}
        <div class="muted">${esc(p.brand || '')} ${esc(p.taken_by || '')} ${esc(p.taken_at || '')}</div>
        <div class="d-flex gap-1 mt-1">${p.primary ? '' : `<button class="btn btn-sm btn-outline-success" onclick="setPrimary('${p.photo_id}')">ตั้งเป็นหลัก</button>`}
        <button class="btn btn-sm btn-outline-danger" onclick="delPhoto('${p.photo_id}')">ลบ</button></div></div></div></div>`).join('') || '<div class="muted">ยังไม่มีรูป</div>';
  }
  function closeDrug() { CUR = null; $('drug').classList.add('d-none'); }

  // ย่อรูปก่อนส่ง (ด้านยาวสุด 1280px) — ส่งเร็วขึ้นมาก
  let IMG64 = null;
  $('fFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const img = await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    IMG64 = c.toDataURL('image/jpeg', 0.85);
    $('preview').src = IMG64; $('preview').classList.remove('d-none'); $('bUp').disabled = false;
  };
  async function upload() {
    if (!IMG64 || !CUR) return;
    $('bUp').disabled = true; $('bUp').textContent = 'กำลังอัปโหลด…';
    const r = await callApi('photoUpload', { icode: CUR.icode, invs_code: $('fInvs').value, tmtid: $('fTmt').value.trim(), brand: $('fBrand').value.trim(), primary: $('fPrimary').checked, base64: IMG64, user: USER.name });
    $('bUp').textContent = 'อัปโหลดรูป';
    if (!r.status) { $('bUp').disabled = false; return Swal.fire('อัปโหลดไม่สำเร็จ', r.message || '', 'error'); }
    IMG64 = null; $('fFile').value = ''; $('preview').classList.add('d-none'); $('fPrimary').checked = false;
    Swal.fire({ icon: 'success', title: 'บันทึกรูปแล้ว', timer: 1200, showConfirmButton: false });
    openDrug(CUR.icode);
  }
  async function setPrimary(id) { await callApi('photoSetPrimary', { photoId: id }); openDrug(CUR.icode); }
  async function delPhoto(id) {
    const ok = await Swal.fire({ title: 'ลบรูปนี้?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' });
    if (!ok.isConfirmed) return;
    await callApi('photoDelete', { photoId: id }); openDrug(CUR.icode);
  }
  try { USER = JSON.parse(localStorage.getItem('photo_user') || 'null'); } catch (e) {}
  if (USER) start();
</script>
</body>
</html>
