<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e40af">
<title>ข้อมูลยา · ห้องยา รพ.สวี</title>
<link rel="icon" href="../sw_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fs:19px;
  --ink:#0f1e3d; --mute:#5b6b8c; --line:#dfe7f5; --card:#fff;
  --g1:#172a6e; --g2:#2563eb; --g3:#22b8f0;
  --pri:#1d4ed8; --pri-bg:#e9f0ff;
  --warn:#a14b0f; --warn-bg:#fff4ea; --warn-bd:#ffd9b8;
  --dang:#b42318; --dang-bg:#fff0ee; --dang-bd:#ffc9c2;
  --vio:#4b3fb5; --vio-bg:#efedff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Kanit,"Noto Sans Thai",Tahoma,sans-serif;font-size:var(--fs);font-weight:500;line-height:1.55;color:var(--ink);
  background:linear-gradient(180deg,#e6efff 0%,#f2f6fd 360px,#f4f7fc 100%);min-height:100vh}
/* ---------- หัว ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:16px 16px 70px;
  background:linear-gradient(125deg,var(--g1) 0%,#1e40af 35%,var(--g2) 70%,var(--g3) 115%);background-size:180% 180%;animation:flow 16s ease-in-out infinite alternate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{left:-80px;bottom:-120px;width:260px;height:260px;background:radial-gradient(circle,rgba(56,189,248,.35),rgba(56,189,248,0) 70%);animation:drift 18s ease-in-out infinite alternate}
.hero::after{right:-60px;top:-80px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(30px,-20px) scale(1.08)}}
@keyframes flow{from{background-position:0% 40%}to{background-position:100% 60%}}
.bar{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto;position:relative;z-index:1}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.org{flex:1;line-height:1.15}
.org b{display:block;font-size:1.05em;font-weight:700}
.org small{font-size:.72em;font-weight:400;opacity:.9}
.fsb{display:flex;gap:4px}
.tbtn{width:38px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;
  font:inherit;font-weight:700;font-size:.78em;cursor:pointer;transition:background .2s}
.tbtn:active{background:rgba(255,255,255,.3)}
/* ---------- เนื้อหา ---------- */
.wrap{max-width:640px;margin:-48px auto 0;padding:0 12px 110px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0;
  box-shadow:0 8px 24px rgba(30,64,175,.07);opacity:0;transform:translateY(14px);animation:up .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.name{padding:18px 18px 16px;border:0;position:relative;overflow:hidden}
.name::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--g2),var(--g3))}
.name h1{margin:0;font-size:1.5em;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.name .th{font-size:1.2em;font-weight:700;margin-top:2px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.72em;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--pri-bg);color:var(--pri)}
.chip.v{background:#e6f7fe;color:#0369a1}
.use{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#0ea5e9 100%);color:#fff;border:0;text-align:center;padding:18px 14px;box-shadow:0 10px 28px rgba(37,99,235,.32)}
.use .lb{font-size:.78em;font-weight:500;opacity:.92;letter-spacing:.3px}
.use .ln{font-size:1.32em;font-weight:700;line-height:1.3}
.use .ln:first-of-type{font-size:1.45em}
h2{font-size:1.06em;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.ic{width:30px;height:30px;flex:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--pri-bg);color:var(--pri)}
.ic svg{width:18px;height:18px}
.txt{white-space:pre-line;font-weight:400}
.warn{background:var(--warn-bg);border-color:var(--warn-bd)}.warn .ic{background:#ffe2c8;color:var(--warn)}.warn h2{color:var(--warn)}
.dang{background:var(--dang-bg);border-color:var(--dang-bd)}.dang .ic{background:#ffd6d0;color:var(--dang)}.dang h2{color:var(--dang)}
.vio .ic{background:var(--vio-bg);color:var(--vio)}
/* แกลเลอรีรูป */
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -4px}
.gal figure{margin:0 4px;flex:0 0 78%;max-width:300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:linear-gradient(90deg,#eef2f7,#f7f9fc,#eef2f7);background-size:200% 100%;animation:sh 1.4s linear infinite}
.gal img.ok{animation:none;background:#fff}
@keyframes sh{to{background-position:-200% 0}}
.gen{margin-left:auto;white-space:nowrap;flex:none;font-size:.62em;font-weight:500;color:var(--mute);background:#eef1f6;border-radius:999px;padding:1px 9px}
.prod{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px;background:#fff}
.prod.cur{border:2px solid #93b4ff;box-shadow:0 6px 18px rgba(37,99,235,.12)}
.prod .ph{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;background:#f1f5fd}
.prod .ph img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:contain;scroll-snap-align:start;background:#f1f5fd}
.prod .ph img.multi{flex-basis:85%}
.prod .tr{padding:8px 12px}
.br{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}.br:first-of-type{border-top:0}
.br b{font-weight:600}.br .when{margin-left:auto;white-space:nowrap;font-size:.78em;color:var(--mute);text-align:right;font-weight:400}
.gal figcaption{padding:6px 10px;font-size:.78em;line-height:1.35;font-weight:400}
.gal figcaption b{font-weight:600}
.now{display:inline-block;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:6px;padding:0 6px;font-size:.85em;font-weight:600}
.vid{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;margin-top:8px;background:#0b1d2e}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vt{font-size:.8em;color:var(--mute);margin-top:4px;font-weight:400}
.empty{text-align:center}
.empty h1{font-size:1.3em;margin:6px 0}
.note{font-size:.72em;color:var(--mute);text-align:center;margin-top:18px;font-weight:400}
.skel{height:120px;border-radius:18px;margin:12px 0;background:linear-gradient(90deg,#e9eef5,#f6f8fb,#e9eef5);background-size:200% 100%;animation:sh 1.4s linear infinite}
/* ---------- ปุ่มล่าง ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:inherit;font-size:.88em;font-weight:700;
  border-radius:14px;padding:10px 8px;border:2px solid var(--pri);color:var(--pri);background:#fff;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#fff;background:linear-gradient(135deg,#1e40af,#2563eb 60%,#0ea5e9);box-shadow:0 6px 16px rgba(37,99,235,.35)}
.btn svg{width:20px;height:20px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="bar">
    <img class="logo" src="../sw_logo.png" alt="โลโก้โรงพยาบาลสวี">
    <div class="org"><b>ห้องยา โรงพยาบาลสวี</b><small>ข้อมูลยาสำหรับผู้ป่วย</small></div>
    <div class="fsb">
      <button class="tbtn" id="fsDn" aria-label="ลดขนาดตัวอักษร">ก-</button>
      <button class="tbtn" id="fsUp" aria-label="เพิ่มขนาดตัวอักษร">ก+</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"><div class="skel"></div><div class="skel" style="height:80px"></div></main>
<nav class="foot"><div class="in">
  <button class="btn" id="speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><span>ฟังเสียงอ่าน</span></button>
  <a class="btn pri" id="call" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span>โทรถามเภสัชกร</span></a>
</div></nav>
<script>
(function(){
'use strict';
var PHARMACY_TEL = '0945854252';
var DATA = 'data/';   /* data/d/<icode>.json · data/u/<drugusage>.json */

var q = new URLSearchParams(location.search);
var icode = (q.get('i') || '').replace(/[^0-9A-Za-z]/g, '');
var ucode = (q.get('u') || '').trim();
var app = document.getElementById('app');

var ICON = {
  info:'<path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/>',
  pill:'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  siren:'<path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14M12 3v1M4.2 7.2l.7.7M19.8 7.2l-.7.7"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
  baby:'<circle cx="12" cy="7" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'
};
function ic(k){ return '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg></span>'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function getJSON(u){ return fetch(u, {cache:'no-cache'}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }
function safeFile(s){ return encodeURIComponent(String(s).replace(/[\/\\]/g, '_')); }
/* รูป: รับ URL ตรง (เช่น lh3.googleusercontent.com) หรือ Google Drive file id/ลิงก์แชร์ */
function imgUrl(v){
  if (!v) return '';
  v = String(v);
  if (/^https:\/\/lh3\.googleusercontent\.com\//.test(v)) return v.replace(/=w\d+$/, '') + '=w800';
  var m = v.match(/[-\w]{25,}/);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[0] + '=w800' : (/^https:\/\//.test(v) ? v : '');
}
function ytId(u){ var m = String(u || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : ''; }
var n = 0;
function card(cls, inner){ return '<section class="card ' + (cls || '') + '" style="animation-delay:' + (0.05 * n++) + 's">' + inner + '</section>'; }
function sec(title, icon, body, cls, generic){
  if (!body || !String(body).trim()) return '';
  return card(cls, '<h2>' + ic(icon) + esc(title) + (generic ? '<span class="gen">คำแนะนำทั่วไป</span>' : '') +
              '</h2><div class="txt">' + esc(body) + '</div>');
}
/* ข้อความกลาง ใช้เมื่อเภสัชกรยังไม่ได้เขียนเฉพาะยา */
var GENERIC = {
  how_to_use: 'ใช้ยาตามขนาดและเวลาที่ระบุบนฉลากอย่างเคร่งครัด\nห้ามเพิ่ม ลดขนาดยา หรือหยุดยาเอง',
  missed_dose: 'ถ้าลืม ให้ใช้ทันทีที่นึกได้ แต่ถ้าใกล้เวลามื้อถัดไป ให้ข้ามมื้อที่ลืมไป\nห้ามเพิ่มยาเป็น 2 เท่า\nยาที่ใช้เฉพาะเวลามีอาการ ไม่ต้องใช้ชดเชย',
  side_effects: 'ยาทุกชนิดอาจมีอาการข้างเคียงได้\nหากพบอาการผิดปกติหลังใช้ยา โทรปรึกษาเภสัชกรได้',
  warning_return: 'ผื่นคัน ลมพิษ ปากบวม ตาบวม หายใจลำบาก แน่นหน้าอก\nผื่นพุพอง ผิวหนังลอก มีแผลในปาก\n(อาจเป็นอาการแพ้ยา)',
  avoid: 'แจ้งแพทย์และเภสัชกรทุกครั้งว่าใช้ยา สมุนไพร หรืออาหารเสริมอะไรอยู่\nห้ามแบ่งยาให้ผู้อื่นใช้ แม้มีอาการเหมือนกัน',
  storage: 'เก็บในที่แห้ง พ้นแสงแดด อุณหภูมิห้อง และพ้นมือเด็ก\n(ยกเว้นฉลากระบุให้เก็บในตู้เย็น)'
};
function gsec(d, key, title, icon, cls){
  var own = d[key] && String(d[key]).trim();
  return sec(title, icon, own ? d[key] : GENERIC[key], cls, !own);
}
/* หญิงตั้งครรภ์: drugitems อาจเก็บเป็นกลุ่ม A B C D X */
function pregText(v){
  v = String(v || '').trim(); if (!v || v === '-') return '';
  var L = (v.toUpperCase().match(/\b[ABCDX]\b/g) || []);
  if (!L.length) return v;
  var w = L.sort().pop(), t = {
    A: 'มีข้อมูลว่าค่อนข้างปลอดภัย ใช้ตามที่แพทย์สั่ง',
    B: 'มีข้อมูลว่าค่อนข้างปลอดภัย ใช้ตามที่แพทย์สั่ง',
    C: 'ใช้เมื่อแพทย์พิจารณาแล้วว่าจำเป็นเท่านั้น',
    D: 'อาจมีผลต่อทารกในครรภ์ แจ้งแพทย์ทันทีถ้าตั้งครรภ์หรือวางแผนจะตั้งครรภ์',
    X: 'ห้ามใช้ในหญิงตั้งครรภ์ แจ้งแพทย์ทันทีถ้าตั้งครรภ์หรือวางแผนจะตั้งครรภ์'}[w];
  return 'กลุ่ม ' + v + ' · ' + t;
}
function lactText(v){
  v = String(v || '').trim(); if (!v || v === '-') return '';
  return /^ok$/i.test(v) ? 'ใช้ได้ระหว่างให้นมบุตร' : v;
}
var TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(s){ var m = String(s || '').match(/^(\d{4})-(\d{2})/); return m ? TM[+m[2] - 1] + ' ' + (+m[1] + 543) : ''; }

/* ขนาดตัวอักษร */
var fs = 19;
try { fs = parseInt(localStorage.getItem('dl_fs'), 10) || 19; } catch(e){}
function setFs(v){ fs = Math.max(16, Math.min(30, v)); document.documentElement.style.setProperty('--fs', fs + 'px');
  try { localStorage.setItem('dl_fs', fs); } catch(e){} }
setFs(fs);
document.getElementById('fsUp').onclick = function(){ setFs(fs + 2); };
document.getElementById('fsDn').onclick = function(){ setFs(fs - 2); };

var call = document.getElementById('call');
if (PHARMACY_TEL) call.href = 'tel:' + PHARMACY_TEL; else call.classList.add('hide');

if (!icode) {
  app.innerHTML = card('empty', '<h1>ไม่พบรหัสยา</h1><div>กรุณาสแกน QR code บนฉลากยาอีกครั้ง</div>');
  return;
}

Promise.all([
  getJSON(DATA + 'd/' + safeFile(icode) + '.json'),
  ucode ? getJSON(DATA + 'u/' + safeFile(ucode) + '.json') : Promise.resolve(null)
]).then(function(res){ render(res[0], res[1]); });

function render(d, u){
  var h = '';
  if (!d) {
    h += card('empty', '<h1>ยังไม่มีข้อมูลยานี้</h1><div class="vt">รหัสยา ' + esc(icode) + '</div>' +
         '<p>ห้องยากำลังจัดทำข้อมูล หากสงสัยเรื่องการใช้ยา โทรถามเภสัชกรได้ทุกวัน</p>');
  } else {
    document.title = (d.th_name || d.name || 'ข้อมูลยา') + ' · รพ.สวี';
    var chips = [d.simple, d.dosageform, d.strength].filter(Boolean)
      .map(function(c, i){ return '<span class="chip' + (i ? ' v' : '') + '">' + esc(c) + '</span>'; }).join('');
    h += card('name', '<h1>' + esc(d.th_name || d.name) + '</h1>' +
         (d.th_name && d.name ? '<div class="th">' + esc(d.name) + '</div>' : '') +
         (chips ? '<div class="chips">' + chips + '</div>' : ''));
  }
  if (u && u.lines && u.lines.length) {
    h += card('use', '<div class="lb">วิธีใช้ตามฉลากของท่าน</div>' +
         u.lines.filter(Boolean).map(function(l){ return '<div class="ln">' + esc(l) + '</div>'; }).join(''));
  }
  if (d) {
    /* หน้าตายา + ชื่อการค้า: จัดกลุ่มตามรหัสสินค้าใน INVS */
    var prods = d.products || [];
    if (!prods.length && ((d.images || []).length || (d.brands || []).length))
      prods = [{images: d.images || [], trades: d.brands || [], current: true}];
    prods = prods.filter(function(p){ return (p.images || []).length || (p.trades || []).length; });
    if (prods.length) {
      h += card('', '<h2>' + ic('img') + 'หน้าตายาและชื่อการค้า</h2>' +
        (prods.length > 1 ? '<div class="vt" style="margin:-4px 0 0">โรงพยาบาลอาจจ่ายยาจากบริษัทใดบริษัทหนึ่ง ตัวยาสำคัญเหมือนกัน</div>' : '') +
        prods.map(function(p){
          var im = (p.images || []).map(imgUrl).filter(Boolean), multi = im.length > 1 ? ' multi' : '';
          return '<div class="prod' + (p.current && prods.length > 1 ? ' cur' : '') + '">' +
            (im.length ? '<div class="ph">' + im.map(function(u){ return '<img class="' + multi + '" loading="lazy" alt="รูปยา" src="' + esc(u) + '" onerror="this.remove()">'; }).join('') + '</div>' : '') +
            ((p.trades || []).length ? '<div class="tr">' + p.trades.map(function(b){
              var w = [b.since ? 'ตั้งแต่ ' + thDate(b.since) : '', b.last ? 'ล่าสุด ' + thDate(b.last) : ''].filter(Boolean).join('<br>');
              return '<div class="br"><div>' + (b.current ? '<span class="now">ที่ใช้อยู่ตอนนี้</span><br>' : '') + '<b>' + esc(b.trade) + '</b></div>' +
                     (w ? '<div class="when">' + w + '</div>' : '') + '</div>';
            }).join('') + '</div>' : '') + '</div>';
        }).join(''));
    }
    h += sec('ยานี้ใช้สำหรับ', 'info', d.indication);
    h += gsec(d, 'how_to_use', 'วิธีใช้ยา', 'pill');
    var vids = (d.videos || d.youtube || []).map(function(v){ return typeof v === 'string' ? {url: v} : v; })
               .filter(function(v){ return v && ytId(v.url); });
    if (vids.length) {
      h += card('vio', '<h2>' + ic('play') + 'คลิปแนะนำการใช้ยา</h2>' + vids.map(function(v){
        return '<div class="vid"><iframe loading="lazy" allowfullscreen title="' + esc(v.title || 'คลิปแนะนำการใช้ยา') + '" ' +
               'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" ' +
               'src="https://www.youtube-nocookie.com/embed/' + ytId(v.url) + '?rel=0"></iframe></div>' +
               (v.title ? '<div class="vt">' + esc(v.title) + '</div>' : '');
      }).join(''));
    }
    h += gsec(d, 'missed_dose', 'ถ้าลืมใช้ยา', 'clock');
    h += gsec(d, 'side_effects', 'อาการข้างเคียงที่อาจพบ', 'alert', 'warn');
    h += gsec(d, 'warning_return', 'หยุดยาและรีบมาพบแพทย์ทันที ถ้ามีอาการ', 'siren', 'dang');
    h += gsec(d, 'avoid', 'ข้อควรระวัง', 'shield', 'warn');
    h += sec('หญิงตั้งครรภ์', 'baby', pregText(d.pregnancy));
    h += sec('หญิงให้นมบุตร', 'baby', lactText(d.lactation));
    h += gsec(d, 'storage', 'การเก็บรักษา', 'box');
    if (d.updated) h += '<p class="note">' + (d.reviewed ? 'ข้อมูลตรวจสอบโดยเภสัชกร · ' : '') + 'ปรับปรุง ' + esc(d.updated) + '</p>';
  }
  h += '<p class="note">ข้อมูลนี้ใช้ประกอบคำแนะนำของแพทย์และเภสัชกรเท่านั้น<br>ห้ามเปลี่ยนขนาดหรือหยุดยาเองโดยไม่ปรึกษา</p>';
  app.innerHTML = h;
}

/* อ่านออกเสียงภาษาไทย */
var sp = document.getElementById('speak'), spT = sp.querySelector('span');
if (!('speechSynthesis' in window)) sp.classList.add('hide');
sp.onclick = function(){
  var s = window.speechSynthesis;
  if (s.speaking) { s.cancel(); spT.textContent = 'ฟังเสียงอ่าน'; return; }
  var t = Array.prototype.map.call(app.querySelectorAll('h1,.th,.use .lb,.use .ln,section h2,.txt'), function(e){ return e.textContent; }).join('. ');
  var m = new SpeechSynthesisUtterance(t); m.lang = 'th-TH'; m.rate = 0.9;
  m.onend = function(){ spT.textContent = 'ฟังเสียงอ่าน'; };
  s.speak(m); spT.textContent = 'หยุดอ่าน';
};
})();
</script>
</body>
</html>
